agent_type: Diffusion_ITQC
agent_control_mode: absolute_joint
seed: 42
soft_update_tau: 0.005
reward_scale: 100.0
env:
  env_id: Piper-Dual-Merged
  library: piper
  env_config_path: agent_infra/Piper_Env/Config/dual_piper_config.yaml
  action_dim: 14
  proprio_dim: 38
  server_mode: false
  obs_horizon: 2
  pred_horizon: 48
  act_horizon: 48
  num_cameras: 3
  obs_mode: rgb
  env_control_mode: absolute_joint
  controller_backend: joint
  control_mode: joint
  reward_mode: sparse
  render_mode: rgb_array
  max_episode_steps: 600
  gamma: 0.9983
  penalty: -600.0
  reward_scale: 400
  reward_shape: false
train:
  device: cuda
  batch_size: 24
  num_workers: 4
  n_epochs: 1000
  save_interval: 5000
  train_object: critic_then_actor
  dataset_mode: expert_dataset
  dataset_key: expert_dataset
  critic_iters: 200
  actor_iters: 200
  critic_ckpt_path: ''
  save_root: run_results
  exp_name: piper_dual_ITQC
dataset:
  dataset_type: diffusion_itqc
  include_rgb: true
  include_depth: false
  expert:
    demo_path: data/merged/dual_merged.h5
    num_traj: null
    format: auto
  replaybuffer:
    max_traj_num: 100
    folder_path: ''
    replaybuffer_path: ''
runner:
  control_hz: 10
  buffer_capacity: 100
  redundancy_margin: 100
  save_dir: data
  hitl_enabled: false
  hitl_override_key: t
  hitl_source: keyboard
  hitl_finalize_intervention: true
actor:
  type: conditional_diffusion
  obs_horizon: 2
  action_dim: 14
  pred_horizon: 48
  require_env_action_dim_match: true
  norm:
    type: min_max
    params: {}
  use_extra_cond: false
  lr: 0.0001
  weight_decay: 1.0e-06
  cond_dim: 1
  cond_embed_dim: 32
  use_cfg_loss: false
  cfg_drop_rate: 0.1
  guidance_scale: 2.0
  unet:
    down_dims:
    - 128
    - 256
    - 512
    diffusion_step_embed_dim: 64
    n_groups: 8
  scheduler:
    num_train_timesteps: 100
    beta_schedule: squaredcos_cap_v2
  encoder:
    visual:
      in_channels: 3
      out_dim: 256
      backbone_type: plain
      pool_feature_map: true
      use_group_norm: true
    proprio_dim: 38
    out_dim: 256
    view_fusion: concat
  CFG_alpha: 0.4
critic:
  type: itqc
  encoder:
    visual:
      in_channels: 3
      out_dim: 256
      backbone_type: plain
      pool_feature_map: true
      use_group_norm: true
    proprio_dim: 38
    out_dim: 256
    view_fusion: concat
  hidden_dims:
  - 256
  - 256
  lr: 0.0002
  num_critics: 5
  num_quantiles: 5
  mc_loss_weight: 0.8
  quantile_huber_kappa: 1.0
agent_sp:
  threshold_quantile_offline: 0.8
  offline_iters_critic: 4000
  offline_iters_actor: 60000
  save_dir: run_results
  exp_name: piper_dual_ITQC
  threshold_quantile_online: 0.3
  online_iters_critic: 20000
  online_iters_actor: 10000
  only_suc: true
