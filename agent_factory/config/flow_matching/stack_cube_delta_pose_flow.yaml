agent_type: Flow_Vanilla
agent_control_mode: delta_pose
seed: 42
env:
  env_id: StackCube-v1
  library: mani_skill
  env_config_path: agent_infra/maniskill_env/Config/stack_cube_pd_ee_delta_pose.yaml
  obs_horizon: 2
  pred_horizon: 16
  act_horizon: 8
  max_episode_steps: 150
  flatten_obs_obj: [all]
  flatten_action: true
train:
  device: cuda:0
  batch_size: 16
  num_workers: 0
  save_interval: 1000
  train_object: actor
  dataset_key: expert_dataset
  critic_iters: 0
  actor_iters: 10000
  ckpt_path: ''
  finetune: false
  save_root: run_result/ManiSkill_Stack_flow
  exp_name: stack_cube_delta_pose_flow
dataset:
  dataset_type: cpiql
  include_rgb: true
  include_depth: false
  expert:
    demo_path: data/maniskill/stack_cube/delta_pose/stack_cube_delta_pose_5_flattened.h5
    num_traj: null
    format: auto
    success_only: true
  replaybuffer:
    max_traj_num: 0
    folder_path: ''
    replaybuffer_path: ''
runner:
  type: base
  control_hz: 20
  buffer_capacity: 100
  redundancy_margin: 100
  save_dir: data/maniskill/stack_cube/delta_pose/rollouts
  no_safe_action_gap: false
  planning_wait_sleep: 0.002
  config_path: agent_factory/runner/config/base.yaml
  config:
    risk_check_hz: 0.0
    risk_use_safe_action: true
actor:
  type: flow_matching
  obs_horizon: 2
  pred_horizon: 16
  require_env_action_dim_match: true
  norm: {type: min_max, params: {}}
  lr: 0.0001
  weight_decay: 0.000001
  num_inference_steps: 10
  time_beta_alpha: 1.5
  time_beta_beta: 1.0
  time_eps: 0.001
  time_embed_scale: 100.0
  clip_sample: true
  unet:
    down_dims: [128, 256, 512]
    diffusion_step_embed_dim: 64
    n_groups: 8
  encoder:
    type: CNN_state_encoder
    include_rgb: true
    visual: {in_channels: 3, out_dim: 256, backbone_type: resnet, pool_feature_map: true, use_group_norm: true}
    proprio_dim: 18
    out_dim: 256
    hidden_dims: [256]
    num_cameras: 2
    view_fusion: concat
critic: null
agent_sp: {iters: 10000, save_dir: run_result/ManiSkill_Stack_flow, exp_name: stack_cube_delta_pose_flow}
